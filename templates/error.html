{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="auth-wrap" style="text-align:center">
    <div class="card">
        <h1 style="font-size:56px;margin:0;color:var(--accent-2)">{{ code }}</h1>
        <p style="color:var(--muted)">{{ message }}</p>
        <a class="btn ghost" href="{{ url_for('home') }}">Back to Home</a>
    </div>
</div>
{% endblock %}
