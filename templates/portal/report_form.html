{% extends "portal/base_portal.html" %}
{% block title %}New Report | Portal{% endblock %}
{% block content %}
<div class="portal-topbar">
    <h1>New Report</h1>
    <a class="btn ghost" href="{{ url_for('reports_list') }}">← Back</a>
</div>

<div class="panel" style="max-width:820px">
    <div class="panel-body">
        {% if machines %}
        <form method="post">
            <div class="field">
                <label>Machinery *</label>
                <select name="machinery_id">
                    {% for m in machines %}
                    <option value="{{ m.id }}">{{ m.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label>Report Title *</label>
                <input type="text" name="title" required placeholder="e.g. Annual Statutory Inspection">
            </div>
            <div class="form-row">
                <div class="field">
                    <label>Type</label>
                    <select name="report_type">
                        {% for t in report_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>Status</label>
                    <select name="status">
                        {% for s in report_statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Summary</label>
                <textarea name="summary" rows="5" placeholder="Findings, remarks, recommendations…"></textarea>
            </div>
            <button class="btn" type="submit">Create Report</button>
        </form>
        {% else %}
        <div class="empty">You need at least one machinery unit first. <a href="{{ url_for('machinery_new') }}">Add machinery</a>.</div>
        {% endif %}
    </div>
</div>
{% endblock %}
