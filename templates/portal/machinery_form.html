{% extends "portal/base_portal.html" %}
{% block title %}{{ 'Edit' if m else 'Add' }} Machinery | Portal{% endblock %}
{% block content %}
<div class="portal-topbar">
    <h1>{{ 'Edit Machinery' if m else 'Add Machinery' }}</h1>
    <a class="btn ghost" href="{{ url_for('machinery_list') }}">← Back</a>
</div>

<div class="panel" style="max-width:820px">
    <div class="panel-body">
        <form method="post">
            <div class="form-row">
                <div class="field">
                    <label>Machine Name *</label>
                    <input type="text" name="name" required value="{{ m.name if m else '' }}" placeholder="e.g. Air Receiver Tank A-101">
                </div>
                <div class="field">
                    <label>Category</label>
                    <select name="category">
                        {% for c in categories %}
                        <option value="{{ c }}" {{ 'selected' if m and m.category == c }}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label>Serial No.</label>
                    <input type="text" name="serial_no" value="{{ m.serial_no if m else '' }}">
                </div>
                <div class="field">
                    <label>Cert No. (PMA / PMT / PMD)</label>
                    <input type="text" name="cert_no" value="{{ m.cert_no if m else '' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label>Location</label>
                    <input type="text" name="location" value="{{ m.location if m else '' }}" placeholder="Plant / site">
                </div>
                <div class="field">
                    <label>Status</label>
                    <select name="status">
                        {% for s in statuses %}
                        <option value="{{ s }}" {{ 'selected' if m and m.status == s }}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="field">
                    <label>Next Inspection Date</label>
                    <input type="date" name="next_inspection" value="{{ m.next_inspection if m else '' }}">
                </div>
                {% if user.role == 'admin' %}
                <div class="field">
                    <label>Owner (Client)</label>
                    <select name="owner_id">
                        <option value="">— Company owned —</option>
                        {% for o in owners %}
                        <option value="{{ o.id }}" {{ 'selected' if m and m.owner_id == o.id }}>{{ o.company or o.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}
            </div>
            <div class="field">
                <label>Notes</label>
                <textarea name="notes" rows="3">{{ m.notes if m else '' }}</textarea>
            </div>
            <button class="btn" type="submit">{{ 'Save Changes' if m else 'Add Machinery' }}</button>
        </form>
    </div>
</div>
{% endblock %}
