{% extends "portal/base_portal.html" %}
{% block title %}{{ 'Edit' if c else 'New' }} Company | Portal{% endblock %}
{% block content %}
<div class="portal-topbar">
    <h1>{{ 'Edit Company' if c else 'New Company' }}</h1>
    <a class="btn ghost" href="{{ url_for('companies_list') }}">← Back</a>
</div>

<div class="panel" style="max-width:720px">
    <div class="panel-body">
        <form method="post" enctype="multipart/form-data">
            <div class="field">
                <label>Company Name *</label>
                <input type="text" name="name" required value="{{ c.name if c else '' }}" placeholder="e.g. ABC Industries Sdn. Bhd.">
            </div>
            <div class="form-row">
                <div class="field">
                    <label>Registration No. (SSM)</label>
                    <input type="text" name="reg_no" value="{{ c.reg_no if c else '' }}" placeholder="202201023780 (1469477-U)">
                </div>
                <div class="field">
                    <label>Phone</label>
                    <input type="text" name="phone" value="{{ c.phone if c else '' }}" placeholder="+603 0000 0000">
                </div>
            </div>
            <div class="field">
                <label>Address</label>
                <textarea name="address" rows="3" placeholder="Full business address">{{ c.address if c else '' }}</textarea>
            </div>
            <div class="field">
                <label>Company Logo (PNG/JPG/WEBP/GIF)</label>
                {% if c and c.logo_filename %}
                    <div style="margin-bottom:8px">
                        <img src="{{ url_for('serve_logo', filename=c.logo_filename) }}" alt="logo" style="height:56px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff">
                    </div>
                {% endif %}
                <input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp,.gif">
                <small style="color:var(--muted)">Logo will appear in the client portal sidebar.</small>
            </div>
            <button class="btn" type="submit">{{ 'Save Changes' if c else 'Create Company' }}</button>
        </form>
    </div>
</div>
{% endblock %}
